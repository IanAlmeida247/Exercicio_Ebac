<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro - Módulo 10</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./main.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick-theme.css"/>
</head>

<body>

    <header>
        <div class="container">
            <h1>Adquira seu veículo agora mesmo!</h1>
        </div>
    </header>

    <div id="carousel-imagens">
        <img src="./media/slide1.png" alt="Carro da Porsche">
        <img src="./media/slide2.png" alt="Carro da BMW">
        <img src="./media/slide3.png" alt="Carro da Ford">
    </div>

    <section>
        <div class="container">
            <h2>Insira seus dados para finalização da compra</h2>
            <form id="form-cadastro">
                <div class="form-campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome">
                </div>
                <div class="form-campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email">
                </div>
                <div class="form-campo">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone">
                </div>
                <div class="form-campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf">
                </div>
                <div class="form-campo">
                    <label for="endereco">Endereço completo</label>
                    <input type="text" id="endereco" name="endereco">
                </div>
                <div class="form-campo">
                    <label for="cep">CEP</label>
                    <input type="text" id="cep" name="cep">
                </div>
                <button type="submit">Enviar</button>
            </form>
        </div>
    </section>

    <script type="text/javascript" src="https://code.jquery.com/jquery-1.11.0.min.js"></script>
    <script type="text/javascript" src="https://code.jquery.com/jquery-migrate-1.2.1.min.js"></script>
    <script type="text/javascript" src="//cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js"></script>
    <script src="./js/jquery.mask.min.js"></script>
    <script src="./js/jquery.validate.min.js"></script>
    <script src="./js/messages_pt_BR.min.js"></script>
    <script src="./js/main.js"></script>
    <script>
        $(document).ready(function() {
            $("#form-cadastro").validate({
                rules: {
                    nome: {
                        required: true
                    },
                    email: {
                        required: true,
                        email: true
                    },
                    telefone: {
                        required: true
                    },
                    cpf: {
                        required: true
                    },
                    endereco: {
                        required: true
                    },
                    cep: {
                        required: true
                    }
                },
                messages: {
                    nome: {
                        required: "Por favor, insira seu nome completo."
                    },
                    email: {
                        required: "Por favor, insira seu e-mail.",
                        email: "Por favor, insira um e-mail válido."
                    },
                    telefone: {
                        required: "Por favor, insira seu telefone."
                    },
                    cpf: {
                        required: "Por favor, insira seu CPF."
                    },
                    endereco: {
                        required: "Por favor, insira seu endereço completo."
                    },
                    cep: {
                        required: "Por favor, insira seu CEP."
                    }
                }
            });
        });
    </script>

</body>

</html>
